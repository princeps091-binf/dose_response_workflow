[workspace]
authors = ["princeps091-binf <princep091@gmail.com>"]
channels = ["conda-forge","bioconda"]
name = "dose_response_workflow"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12.13,<3.13"
pandas = ">=3.0.5,<4"
seaborn = ">=0.13.2,<0.14"
numpy = ">=2.5.2,<3"
scipy = ">=1.18.0,<2"
r-base = ">=4.5.3,<4.6"
r-renv = ">=1.2.4,<2"
zlib = ">=1.3.2,<2"
icu = ">=78.3,<79"
libuv = ">=1.52.1,<2"
libxml2 = ">=2.15.3,<3"
lxml = ">=6.1.2,<7"
r-languageserver = ">=0.3.18,<0.4"
bioframe = ">=0.8.0,<0.9"
networkx = ">=3.6.1,<4"
kneed = ">=0.8.6,<0.9"
hilbertcurve = ">=2.0.5,<3"
plotly = ">=6.9.0,<7"
python-dotenv = ">=1.2.3,<2"
optuna = ">=4.9.0,<5"

[pypi-dependencies]
fast-hdbscan = ">=0.3.2, <0.4"
xlmhglite = ">=1.1.1, <2"
tabpfn = ">=8.4.0, <9"
tabpfn-extensions = { version = ">=0.6.0, <0.7", extras = ["interpretability"] }
